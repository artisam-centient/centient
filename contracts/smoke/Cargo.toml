[package]
name = "centient-smoke"
version = "0.0.0"
description = "A trivial contract that proves the Soroban toolchain builds and tests in CI"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
